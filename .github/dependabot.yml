version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # A version gets a few days on the registry before we take it, the same idea as
    # safectx's own cooldown: most malicious releases are pulled within that window.
    # Security updates skip the cooldown.
    cooldown:
      default-days: 5
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      # Runtime dependencies ship to users: one PR per week, reviewed on its own.
      runtime:
        dependency-type: production
      dev:
        dependency-type: development
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ['*']
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
