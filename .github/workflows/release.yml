name: Release

# Publishes to npm. Two ways in, both deliberate:
#   - publishing a GitHub Release whose tag is v<version in package.json>;
#   - running it by hand with the tag and a confirmation that repeats it.
# Then a person approves the npm-publish environment. See docs/RELEASE.md.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, e.g. v0.3.0 (must already exist and match package.json)'
        required: true
        type: string
      confirm:
        description: 'Type "publish <tag>" to confirm, e.g. "publish v0.3.0"'
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    # Builds and checks the exact tarball to publish. No publishing credential here.
    name: verify and pack
    # Build and checks run on Hiper AI's own runner; only the publish job below needs GitHub's.
    runs-on: hiperai-ci
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
      dist_tag: ${{ steps.guard.outputs.dist_tag }}
    steps:
      - name: Confirm a manual run
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.tag }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "publish $TAG" ]; then
            echo "::error::Confirmation must be exactly \"publish $TAG\"."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Tag matches package.json, tag is on main
        id: guard
        env:
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
          PRERELEASE: ${{ github.event_name == 'release' && github.event.release.prerelease || 'false' }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version (expected v$version)."
            exit 1
          fi
          if ! git branch -r --contains HEAD | grep -qxE '[[:space:]]*origin/main'; then
            echo "::error::Tag $TAG points to a commit that is not on main."
            exit 1
          fi
          if [ "$PRERELEASE" = "true" ] || [[ "$version" == *-* ]]; then
            echo "dist_tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Self-audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node dist/cli.js audit package-lock.json --fail-on=high
          node dist/cli.js audit .github/workflows --fail-on=high
          npm audit signatures

      - name: Pack
        id: pack
        run: |
          npm pack --ignore-scripts --json > pack.json
          node scripts/check-pack.mjs pack.json
          tarball="$(node -p "require('./pack.json')[0].filename")"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$tarball" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Smoke test the tarball
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          tarball="$PWD/$TARBALL"
          dir="$(mktemp -d)"
          cd "$dir"
          npm init -y > /dev/null
          npm install --ignore-scripts --no-audit --no-fund "$tarball"
          npx --no-install safectx --version
          npx --no-install safectx check npm express

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  publish:
    # Only this job can mint an OIDC token, and only after a reviewer approves the environment.
    name: publish to npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # npm trusted publishing (OIDC) and provenance do not support self-hosted runners
    # (docs.npmjs.com/trusted-publishers), so this one job uses GitHub-hosted minutes:
    # about a minute per release.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Same tarball that was verified
        env:
          TARBALL: ${{ needs.verify.outputs.tarball }}
          SHA256: ${{ needs.verify.outputs.sha256 }}
        run: echo "$SHA256  $TARBALL" | sha256sum --check --strict

      - name: npm supports trusted publishing
        run: |
          # Trusted publishing needs npm >= 11.5.1.
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)" \
            || { echo "::error::npm $(npm --version) is older than 11.5.1"; exit 1; }

      - name: Publish
        env:
          TARBALL: ${{ needs.verify.outputs.tarball }}
          DIST_TAG: ${{ needs.verify.outputs.dist_tag }}
        run: npm publish "./$TARBALL" --provenance --access public --tag "$DIST_TAG" --ignore-scripts
