<!doctype html>
<!-- Source of public/og.png (1200x630). Screenshot it at 1200x630, device scale 1, with any headless
     browser; site/README.md has the command. Not part of the site build. Fonts and the lockup load
     from site/public, so open this file from its place in the repository. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Geist"; src: url("../public/fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Geist Mono"; src: url("../public/fonts/GeistMono-Variable.woff2") format("woff2"); font-weight: 100 900; }
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; box-sizing: border-box;
    background: #fafafa; color: #0a0a0a;
    font-family: "Geist", system-ui, sans-serif;
    padding: 64px 72px; display: flex; flex-direction: column; justify-content: space-between;
  }
  .lockup { height: 44px; width: auto; display: block; align-self: flex-start; }
  h1 { font-size: 54px; line-height: 1.06; letter-spacing: -0.035em; margin: 0; font-weight: 600; max-width: 1000px; }
  .term { background: #111111; border-radius: 14px; padding: 22px 26px; color: #ededed;
    font-family: "Geist Mono", ui-monospace, monospace; font-size: 19px; line-height: 1.55; }
  .run { color: #a1a1a1; }
  .bad { color: #ff6b5e; }
  .good { color: #5ad17a; }
  .foot { display: flex; justify-content: space-between; font-size: 22px; color: #666666; border-top: 1px solid #e6e6e6; padding-top: 20px; }
  .foot b { color: #0a0a0a; font-weight: 600; }
</style>
</head>
<body>
  <img class="lockup" src="../public/brand/lockup.svg" alt="pinright">
  <h1>Version-accurate docs and a dependency check for coding agents</h1>
  <div class="term">
    <div class="run">● Bash  npm install lodash@4.17.20</div>
    <div><span class="bad">pinright blocked</span> this dependency change:</div>
    <div>- lodash@4.17.20 has <span class="bad">5 known advisories</span>. Use 4.x release <span class="good">4.18.1</span></div>
  </div>
  <div class="foot"><span>Open source · MIT</span><b>pinright.dev</b></div>
</body>
</html>
